version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DB_PATH=/app/data/data.sqlite
    volumes:
      - backend_data:/app/data
    expose:
      - '4000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: expense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  backend_data:
